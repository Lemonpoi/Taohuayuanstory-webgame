<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>桃花源记 · 跳一跳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;touch-action:none;font-family:'STKaiti','KaiTi','SimSun','FangSong',serif}
canvas{display:block;touch-action:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="g"></canvas>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');
let W,H,scale;
function resize(){
  W=Math.min(500,window.innerWidth); H=Math.min(800,window.innerHeight);
  const r=Math.min(window.innerWidth/W,window.innerHeight/H);
  C.style.width=W*r+'px'; C.style.height=H*r+'px';
  C.width=W; C.height=H; scale=r;
}
resize(); window.addEventListener('resize',resize);

// Audio
let aCtx=null;
function initAudio(){
  if(!aCtx) aCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function playTone(f,d,t=0,g=0.1){
  try{
    initAudio(); const o=aCtx.createOscillator(),v=aCtx.createGain();
    o.connect(v); v.connect(aCtx.destination);
    o.type=t||'sine'; o.frequency.setValueAtTime(f,aCtx.currentTime);
    v.gain.setValueAtTime(g,aCtx.currentTime);
    v.gain.exponentialRampToValueAtTime(0.001,aCtx.currentTime+d);
    o.start(aCtx.currentTime); o.stop(aCtx.currentTime+d);
  }catch(e){}
}
function sndJump(){playTone(520,0.12,'sine',0.08);setTimeout(()=>playTone(660,0.1,'sine',0.06),40);}
function sndCharge(){playTone(300+Math.random()*80,0.08,'sine',0.03);}
function sndLand(){playTone(880,0.08,'sine',0.06);setTimeout(()=>playTone(1100,0.06,'sine',0.04),30);}
function sndPerfect(){playTone(1040,0.12,'sine',0.08);setTimeout(()=>playTone(1320,0.1,'sine',0.07),60);setTimeout(()=>playTone(1560,0.15,'sine',0.06),120);}
function sndFail(){playTone(300,0.2,'sawtooth',0.06);setTimeout(()=>playTone(200,0.3,'sawtooth',0.05),100);}
function sndBtn(){playTone(660,0.06,'sine',0.05);}
function sndCombo(){const n=Math.min(combo,5);playTone(880+n*80,0.08,'sine',0.05);}

// State
let state='menu',score=0,best=parseInt(localStorage.getItem('thsBest')||'0');
let combo=0,charge=0,charging=false;
let px,py,pvx=0,pvy=0,onGround=false,facing=1;
let plats=[],camY=0,targetCamY=0;
let petals=[],mist=[],water=[],sparkles=[],trail=[];
let sceneLevel=0,sceneNames=['桃花溪畔','桃林深处','青石小径','竹林幽谷','溪涧清流','花间小筑','云雾山阶','古亭远眺','桃源仙境'];
let frame=0,gameOverTimer=0;
let bgmGain=null,bgmOsc=null,bgmInterval=null;
let chargeVibration=0;

function initGame(){
  score=0; combo=0; charge=0; charging=false; camY=0; targetCamY=0;
  px=W/2; py=H*0.6; pvx=0; pvy=0; onGround=true; facing=1;
  trail=[]; sparkles=[]; gameOverTimer=0; sceneLevel=0;
  plats=[];
  for(let i=0;i<12;i++){
    const y=H*0.7-i*80-Math.random()*30;
    plats.push(makePlat(W/2+(Math.random()-0.5)*120,y));
  }
  state='playing';
}

function makePlat(x,y){
  const w=60+Math.random()*50;
  const types=['stone','wood','bamboo','jade','thatch'];
  return {x,y,w,h:16,type:types[Math.floor(Math.random()*types.length)],color:randColor(),hit:false,sparked:false};
}
const platColors=['#e8d5b0','#f0dcc0','#d4c5a0','#c8e6c9','#a5d6a7','#ffccbc','#ffe0b2','#b2dfdb'];
function randColor(){return platColors[Math.floor(Math.random()*platColors.length)];}

function addPlat(){
  const last=plats[plats.length-1];
  let nx=last.x+(Math.random()-0.5)*140;
  nx=Math.max(30,Math.min(W-30,nx));
  const ny=last.y-70-Math.random()*50;
  const p=makePlat(nx,ny);
  p.x=nx; p.y=ny;
  plats.push(p);
}

// Particles
function spawnPetals(n){
  for(let i=0;i<n;i++){
    petals.push({
      x:Math.random()*W,y:Math.random()*H*0.3,r:2+Math.random()*4,
      vy:0.3+Math.random()*0.6,vx:(Math.random()-0.5)*0.5,
      swing:Math.random()*Math.PI*2,swingSpd:0.01+Math.random()*0.02,
      alpha:0.3+Math.random()*0.5,rot:Math.random()*Math.PI*2,
      type:Math.random()>0.5?'petal':'blossom'
    });
  }
}
function spawnMist(n){
  for(let i=0;i<n;i++){
    mist.push({
      x:Math.random()*W*1.2-W*0.1,y:Math.random()*H*0.6+H*0.1,
      r:20+Math.random()*50,vx:0.1+Math.random()*0.3,
      alpha:0.05+Math.random()*0.1
    });
  }
}
function spawnWater(){
  for(let i=0;i<30;i++){
    water.push({
      x:Math.random()*W,y:H*0.92+Math.random()*H*0.05,
      w:80+Math.random()*150,h:2+Math.random()*4,
      vx:0.1+Math.random()*0.2,alpha:0.1+Math.random()*0.2
    });
  }
}
function spawnSparkles(x,y,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    sparkles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,decay:0.015+Math.random()*0.02,size:2+Math.random()*4,color:['#FFD700','#FFF8E1','#FFE082','#FFECB3'][Math.floor(Math.random()*4)]});
  }
}
function spawnSplash(x,y){
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+Math.random()*Math.PI,s=1+Math.random()*3;
    sparkles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.6,decay:0.025,size:2+Math.random()*3,color:'rgba(200,230,255,0.6)'});
  }
}

// Draw functions
function drawBg(){
  // Sky gradient - ink wash style
  const sg=X.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#f0ebe3');
  sg.addColorStop(0.3,'#f5f0e8');
  sg.addColorStop(0.5,'#e8e0d5');
  sg.addColorStop(0.7,'#d8cfc0');
  sg.addColorStop(1,'#c0b8a8');
  X.fillStyle=sg; X.fillRect(0,0,W,H);

  // Distant mountains
  drawMountains();

  // Clouds
  drawClouds();

  // Mist overlay
  for(const m of mist){
    X.beginPath();
    X.ellipse(m.x,m.y,m.r,m.r*0.4,0,0,Math.PI*2);
    X.fillStyle=`rgba(255,255,255,${m.alpha})`;
    X.fill();
  }

  // Peach blossom trees in background
  drawPeachTrees();

  // Stream at bottom
  drawStream();
}

function drawMountains(){
  X.save();
  // Far mountains - light ink
  X.fillStyle='rgba(160,180,190,0.2)';
  X.beginPath(); X.moveTo(0,H*0.5);
  for(let x=0;x<=W;x+=20){
    const y=H*0.45+Math.sin(x*0.003)*30+Math.sin(x*0.007)*15+Math.sin(x*0.015)*8;
    X.lineTo(x,y);
  }
  X.lineTo(W,H*0.7); X.lineTo(0,H*0.7); X.closePath(); X.fill();

  // Mid mountains - slightly darker
  X.fillStyle='rgba(140,160,175,0.25)';
  X.beginPath(); X.moveTo(0,H*0.55);
  for(let x=0;x<=W;x+=20){
    const y=H*0.5+Math.sin(x*0.004+1)*25+Math.sin(x*0.009+2)*12+Math.sin(x*0.02)*6;
    X.lineTo(x,y);
  }
  X.lineTo(W,H*0.75); X.lineTo(0,H*0.75); X.closePath(); X.fill();
  X.restore();
}

function drawClouds(){
  X.save();
  const t=frame*0.0003;
  X.fillStyle='rgba(255,255,255,0.12)';
  for(let i=0;i<6;i++){
    const cx=(i*W/6+Math.sin(t+i*2)*40+frame*0.02*i*20)%(W+100)-50;
    const cy=H*0.15+Math.sin(i*1.5+t)*20;
    X.beginPath();
    X.ellipse(cx,cy,80+Math.sin(t+i)*20,16+Math.sin(t*0.5+i)*6,0,0,Math.PI*2);
    X.fill();
    X.beginPath();
    X.ellipse(cx+40+Math.sin(t+i)*15,cy-8,50+Math.sin(t*0.7+i)*15,12,0,0,Math.PI*2);
    X.fill();
  }
  X.restore();
}

function drawPeachTrees(){
  X.save();
  const t=frame*0.002;
  for(let i=0;i<4;i++){
    const tx=i*W/3+30+Math.sin(i*2)*40;
    const ty=H*0.45+Math.sin(i*3)*20;
    // Trunk
    X.strokeStyle='rgba(120,80,60,0.3)'; X.lineWidth=4;
    X.beginPath(); X.moveTo(tx,ty); X.lineTo(tx-5+Math.sin(i)*5,ty+40); X.stroke();
    // Canopy
    X.fillStyle='rgba(255,180,180,0.12)';
    X.beginPath();
    X.arc(tx,ty-10,30+15*Math.sin(t+i),0,Math.PI*2); X.fill();
    X.beginPath();
    X.arc(tx+20+10*Math.sin(t*0.5+i),ty-15,20+10*Math.cos(t*0.3+i),0,Math.PI*2); X.fill();
    X.beginPath();
    X.arc(tx-18+8*Math.sin(t*0.7+i),ty-8,18+8*Math.cos(t*0.4+i),0,Math.PI*2); X.fill();
  }
  X.restore();
}

function drawStream(){
  X.save();
  for(const w of water){
    X.beginPath();
    X.ellipse(w.x,w.y,w.w,w.h,0,0,Math.PI*2);
    X.fillStyle=`rgba(180,210,230,${w.alpha})`;
    X.fill();
  }
  // Water surface line
  X.strokeStyle='rgba(150,190,210,0.15)';
  X.lineWidth=1;
  X.beginPath(); X.moveTo(0,H*0.91);
  for(let x=0;x<=W;x+=5){
    X.lineTo(x,H*0.91+Math.sin(x*0.02+frame*0.01)*3);
  }
  X.stroke();
  X.restore();
}

function drawPlatform(p){
  X.save();
  const y=p.y-camY;
  if(y<-50||y>H+50){X.restore();return;}
  X.shadowColor='rgba(0,0,0,0.08)';
  X.shadowBlur=8; X.shadowOffsetY=3;

  // Platform body based on type
  const bw=p.w,bh=p.h;
  switch(p.type){
    case 'stone':
      X.fillStyle='#b0a090'; X.beginPath(); X.roundRect(p.x,y,bw,bh,4); X.fill();
      X.fillStyle='#c8b8a8'; X.beginPath(); X.roundRect(p.x+2,y-2,bw-4,bh-2,3); X.fill();
      X.strokeStyle='rgba(100,80,60,0.15)'; X.lineWidth=1; X.beginPath(); X.roundRect(p.x,y,bw,bh,4); X.stroke();
      // Moss
      X.fillStyle='rgba(140,180,130,0.2)'; X.beginPath(); X.roundRect(p.x+8,y+2,12,4,2); X.fill();
      break;
    case 'wood':
      X.fillStyle='#c4a882'; X.beginPath(); X.roundRect(p.x,y,bw,bh,3); X.fill();
      X.fillStyle='#d4b892'; X.beginPath(); X.roundRect(p.x+2,y-1,bw-4,bh-2,2); X.fill();
      for(let i=0;i<3;i++){X.strokeStyle='rgba(100,70,40,0.1)';X.lineWidth=1;X.beginPath();X.moveTo(p.x+4,y+2+i*5);X.lineTo(p.x+bw-4,y+2+i*5);X.stroke();}
      break;
    case 'bamboo':
      X.fillStyle='#8dad7a'; X.beginPath(); X.roundRect(p.x,y,bw,bh,4); X.fill();
      X.fillStyle='#9dbd8a'; X.beginPath(); X.roundRect(p.x+2,y-2,bw-4,bh-2,3); X.fill();
      for(let i=0;i<bw/12;i++){X.strokeStyle='rgba(60,100,40,0.1)';X.lineWidth=1;X.beginPath();X.moveTo(p.x+4+i*12,y);X.lineTo(p.x+4+i*12,y+bh);X.stroke();}
      break;
    case 'jade':
      X.fillStyle='#8fc5b0'; X.beginPath(); X.roundRect(p.x,y,bw,bh,6); X.fill();
      X.fillStyle='#a0d5c0'; X.beginPath(); X.roundRect(p.x+2,y-2,bw-4,bh-2,5); X.fill();
      X.shadowColor='rgba(140,200,180,0.2)'; X.shadowBlur=12;
      X.strokeStyle='rgba(140,200,180,0.3)'; X.lineWidth=1; X.beginPath(); X.roundRect(p.x,y,bw,bh,6); X.stroke();
      break;
    case 'thatch':
      X.fillStyle='#c8b080'; X.beginPath(); X.roundRect(p.x,y,bw,bh,3); X.fill();
      X.fillStyle='#d8c090'; X.beginPath(); X.roundRect(p.x+2,y-2,bw-4,bh-2,2); X.fill();
      X.strokeStyle='rgba(140,110,70,0.15)'; X.lineWidth=1;
      for(let i=0;i<bw/8;i++){X.beginPath();X.moveTo(p.x+4+i*8,y+bh);X.lineTo(p.x+6+i*8,y);X.stroke();}
      break;
  }
  X.shadowBlur=0; X.shadowOffsetY=0;
  X.restore();
}

function drawPlayer(){
  const y=py-camY;
  X.save(); X.translate(px,y);

  // Trail
  for(const t of trail){
    X.globalAlpha=t.a*0.15;
    X.fillStyle='#e8d8c8';
    X.beginPath(); X.roundRect(-8-t.ox,-16-t.oy,16,26,4); X.fill();
  }
  X.globalAlpha=1;

  // Shadow
  if(onGround||pvy<0){
    X.fillStyle='rgba(0,0,0,0.1)'; X.beginPath();
    X.ellipse(0,12+chargeVibration,10+charge*6,4+charge*2,0,0,Math.PI*2); X.fill();
  }

  const s=chargeVibration;
  // Body - Hanfu
  const grad=X.createLinearGradient(-10,-18,10,-18);
  grad.addColorStop(0,'#e8d8c8'); grad.addColorStop(0.5,'#f0e8dc'); grad.addColorStop(1,'#e0d0c0');
  X.fillStyle=grad;
  if(!onGround&&pvy<0){ // Jumping up
    X.beginPath(); X.roundRect(-10,-14,20,22,5); X.fill();
    // Arms up
    X.strokeStyle='#e0d0c0'; X.lineWidth=3;
    X.beginPath(); X.moveTo(-10,-10); X.lineTo(-20,-22)*facing; X.stroke();
    X.beginPath(); X.moveTo(10,-10); X.lineTo(20,-22)*facing; X.stroke();
  }else if(!onGround&&pvy>0){ // Falling
    X.beginPath(); X.roundRect(-10,-14,20,22,5); X.fill();
    X.strokeStyle='#e0d0c0'; X.lineWidth=3;
    X.beginPath(); X.moveTo(-10,-8); X.lineTo(-18,-14); X.stroke();
    X.beginPath(); X.moveTo(10,-8); X.lineTo(18,-14); X.stroke();
  }else{
    X.beginPath(); X.roundRect(-10,-14,20,22,5); X.fill();
    // Arms at side
    X.strokeStyle='#e0d0c0'; X.lineWidth=3;
    X.beginPath(); X.moveTo(-10,-8); X.lineTo(-16,-2); X.stroke();
    X.beginPath(); X.moveTo(10,-8); X.lineTo(16,-2); X.stroke();
  }

  // Belt/sash
  X.fillStyle='#c0392b'; X.fillRect(-4,-4,8,3);
  // Ribbon
  X.strokeStyle='#e74c3c'; X.lineWidth=1.5;
  X.beginPath(); X.moveTo(-4,-4); X.lineTo(-14,2); X.moveTo(4,-4); X.lineTo(14,2); X.stroke();

  // Head
  X.fillStyle='#ffe0c0'; X.beginPath(); X.arc(0,-20,10,0,Math.PI*2); X.fill();

  // Hair
  X.fillStyle='#2c1810';
  X.beginPath(); X.arc(0,-22,10,-Math.PI,0); X.fill();
  X.beginPath(); X.roundRect(-10,-24,20,6,3); X.fill();
  // Hair bun
  X.beginPath(); X.arc(-5,-26,5,0,Math.PI*2); X.fill();
  X.beginPath(); X.arc(5,-26,5,0,Math.PI*2); X.fill();
  // Hairpin
  X.strokeStyle='#ffd700'; X.lineWidth=1.5;
  X.beginPath(); X.moveTo(6,-28); X.lineTo(16,-32); X.stroke();
  X.fillStyle='#ff6b6b'; X.beginPath(); X.arc(16,-32,2.5,0,Math.PI*2); X.fill();

  // Face
  X.fillStyle='#333';
  X.beginPath(); X.arc(-4,-19,2,0,Math.PI*2); X.fill();
  X.beginPath(); X.arc(4,-19,2,0,Math.PI*2); X.fill();
  // Blush
  X.fillStyle='rgba(255,150,150,0.2)';
  X.beginPath(); X.ellipse(-8,-16,4,2.5,0,0,Math.PI*2); X.fill();
  X.beginPath(); X.ellipse(8,-16,4,2.5,0,0,Math.PI*2); X.fill();
  // Smile
  X.strokeStyle='#c0392b'; X.lineWidth=1.5;
  X.beginPath(); X.arc(0,-14,4,0.1,Math.PI-0.1); X.stroke();

  // Legs
  X.fillStyle='#d4c4b0';
  X.beginPath(); X.roundRect(-6,8,5,6,2); X.fill();
  X.beginPath(); X.roundRect(1,8,5,6,2); X.fill();
  // Shoes
  X.fillStyle='#5d4037';
  X.beginPath(); X.roundRect(-7,13,7,4,2); X.fill();
  X.beginPath(); X.roundRect(0,13,7,4,2); X.fill();

  // Charge glow
  if(charging&&charge>0.05){
    X.shadowColor='rgba(255,200,100,0.4)'; X.shadowBlur=20+charge*20;
    X.strokeStyle=`rgba(255,200,100,${charge*0.3})`; X.lineWidth=2;
    X.beginPath(); X.arc(0,0,16+charge*20,0,Math.PI*2); X.stroke();
    X.shadowBlur=0;
  }

  X.restore();
}

function drawHUD(){
  X.save();
  // Score
  X.fillStyle='rgba(60,40,30,0.6)';
  X.font='bold 36px "Ma Shan Zheng","STKaiti",serif';
  X.textAlign='center';
  X.fillText(`${score}`,W/2,50);

  // Combo
  if(combo>=3){
    X.fillStyle='rgba(255,200,100,0.6)';
    X.font='16px "Ma Shan Zheng","STKaiti",serif';
    X.textAlign='center';
    X.fillText(`连击 x${combo}`,W/2,76);
  }

  // Best
  X.fillStyle='rgba(60,40,30,0.4)';
  X.font='13px "STKaiti",serif';
  X.textAlign='right';
  X.fillText(`最高 ${best}`,W-12,24);

  // Scene name
  const sn=sceneNames[Math.min(sceneLevel,sceneNames.length-1)];
  X.fillStyle='rgba(60,40,30,0.3)';
  X.font='13px "STKaiti",serif';
  X.textAlign='left';
  X.fillText(sn,12,24);

  // Pause btn
  X.fillStyle='rgba(60,40,30,0.15)';
  X.beginPath(); X.roundRect(W-48,6,36,32,6); X.fill();
  X.fillStyle='rgba(60,40,30,0.5)';
  X.font='16px sans-serif'; X.textAlign='center';
  X.fillText('⏸',W-30,28);

  X.restore();
}

function drawMenu(){
  X.save();
  const sg=X.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#f5ece0'); sg.addColorStop(0.5,'#f0e0d0'); sg.addColorStop(1,'#e8d0c0');
  X.fillStyle=sg; X.fillRect(0,0,W,H);

  for(const m of mist){
    X.beginPath(); X.ellipse(m.x,m.y,m.r,m.r*0.4,0,0,Math.PI*2);
    X.fillStyle=`rgba(255,255,255,${m.alpha*0.5})`; X.fill();
  }

  X.textAlign='center';
  X.fillStyle='rgba(180,120,130,0.15)'; X.font='120px "STKaiti",serif';
  X.fillText('桃花源',W/2,H*0.25);

  X.fillStyle='rgba(100,70,60,0.8)'; X.font='bold 42px "Ma Shan Zheng","STKaiti",serif';
  X.fillText('桃 花 源 记',W/2,H*0.32);

  X.fillStyle='rgba(120,90,80,0.5)'; X.font='16px "STKaiti",serif';
  X.fillText('· 跳 一 跳 ·',W/2,H*0.38);

  // Peach blossom decoration
  for(let i=0;i<5;i++){
    const a=frame*0.002+i*1.26,r=60+Math.sin(frame*0.003+i)*10;
    X.fillStyle='rgba(255,180,180,0.15)';
    X.beginPath(); X.arc(W/2+Math.cos(a)*r,H*0.15+Math.sin(a)*r*0.5,12+4*Math.sin(frame*0.005+i),0,Math.PI*2); X.fill();
  }

  // Subtitle
  X.fillStyle='rgba(100,70,60,0.4)'; X.font='14px "STKaiti",serif';
  X.fillText('长按蓄力 · 松手跳跃',W/2,H*0.7);

  // Start btn
  const bx=W/2-60,by=H*0.55,bw=120,bh=44;
  X.shadowColor='rgba(255,200,180,0.3)'; X.shadowBlur=20;
  X.fillStyle='rgba(200,150,140,0.2)';
  X.beginPath(); X.roundRect(bx,by,bw,bh,22); X.fill();
  X.strokeStyle='rgba(180,130,120,0.4)'; X.lineWidth=1.5;
  X.beginPath(); X.roundRect(bx,by,bw,bh,22); X.stroke();
  X.shadowBlur=0;
  X.fillStyle='rgba(100,70,60,0.7)'; X.font='bold 20px "Ma Shan Zheng","STKaiti",serif';
  X.fillText('开始游玩',W/2,by+30);

  X.fillStyle='rgba(140,110,100,0.3)'; X.font='12px "STKaiti",serif';
  X.fillText(`历史最高：${best}`,W/2,H*0.88);

  X.restore();
}

function drawGameOver(){
  X.save();
  X.fillStyle='rgba(0,0,0,0.4)';
  X.fillRect(0,0,W,H);

  X.textAlign='center';
  X.fillStyle='rgba(255,255,255,0.8)'; X.font='bold 36px "Ma Shan Zheng","STKaiti",serif';
  X.fillText('归 去',W/2,H*0.38);

  X.fillStyle='rgba(255,255,255,0.6)'; X.font='24px "STKaiti",serif';
  X.fillText(`得分：${score}`,W/2,H*0.46);

  if(score>=best&&score>0){
    X.fillStyle='rgba(255,200,100,0.7)'; X.font='16px "STKaiti",serif';
    X.fillText('✦ 新纪录 ✦',W/2,H*0.52);
  }

  X.fillStyle='rgba(200,200,200,0.4)'; X.font='15px "STKaiti",serif';
  X.fillText('「不足为外人道也」',W/2,H*0.59);

  X.fillStyle='rgba(255,255,255,0.5)'; X.font='13px "STKaiti",serif';
  X.fillText(`最高记录：${best}`,W/2,H*0.65);

  // Restart btn
  const bx=W/2-55,by=H*0.71,bw=110,bh=40;
  X.fillStyle='rgba(200,150,140,0.3)';
  X.beginPath(); X.roundRect(bx,by,bw,bh,20); X.fill();
  X.strokeStyle='rgba(200,150,140,0.4)'; X.lineWidth=1.5;
  X.beginPath(); X.roundRect(bx,by,bw,bh,20); X.stroke();
  X.fillStyle='rgba(255,255,255,0.7)'; X.font='bold 18px "Ma Shan Zheng","STKaiti",serif';
  X.fillText('再来一次',W/2,by+27);

  X.restore();
}

function update(){
  frame++;
  if(state==='playing'){
    // Update scene level
    sceneLevel=Math.min(Math.floor(score/20),sceneNames.length-1);

    // Physics
    if(!onGround){
      pvy+=0.5;
      py+=pvy;
    }

    // Charge
    if(charging&&onGround){
      charge=Math.min(1,charge+0.025);
      chargeVibration=Math.sin(frame*0.5)*charge*3;
      if(frame%4===0) sndCharge();
    }

    // Platform collision
    onGround=false;
    for(const p of plats){
      const py2=py;
      if(pvy>0&&px>p.x&&px<p.x+p.w&&py2>p.y-camY-18&&py2<p.y-camY+8){
        py=p.y-camY-16; pvy=0; onGround=true;
        if(charge>0){
          const cx=p.x+p.w/2,dist=Math.abs(px-cx);
          if(dist<10){score+=3;combo++;sndPerfect();spawnSparkles(px,py,12);p.sparked=true;
            if(combo>=3&&combo%3===0){sndCombo();for(let k=0;k<20;k++)spawnSparkles(px-20+Math.random()*40,py-10-Math.random()*20,3);}
          }else if(dist<25){score+=2;combo++;sndLand();spawnSplash(px,py+8);
          }else{score+=1;combo=0;sndLand();}
          chargeVibration=0; charge=0;
          // Trail
          for(let i=0;i<5;i++)trail.push({x:px,y:py-camY,ox:(Math.random()-0.5)*4,oy:(Math.random()-0.5)*2,a:0.3+Math.random()*0.3});
        }
        break;
      }
    }

    // Trail fade
    for(const t of trail)t.a-=0.02;
    trail=trail.filter(t=>t.a>0);

    // Scroll
    targetCamY=Math.max(0,-(py-H*0.4));
    if(py<H*0.4&&pvy<0)targetCamY=-(py-H*0.4);
    camY+=(targetCamY-camY)*0.08;

    // Generate platforms ahead
    while(plats.length<15){
      const last=plats[plats.length-1];
      let nx=last.x+(Math.random()-0.5)*140;
      nx=Math.max(30,Math.min(W-30,nx));
      const ny=last.y-70-Math.random()*50;
      plats.push(makePlat(nx,ny));
    }

    // Remove off-screen
    plats=plats.filter(p=>p.y-camY<H+100);

    // Fall check
    if(py>H+50){
      if(best<score){best=score;localStorage.setItem('thsBest',best);}
      state='over'; sndFail(); gameOverTimer=0;
    }

    // Particles
    for(const p of petals){
      p.x+=p.vx+Math.sin(frame*0.003+p.swing)*0.3;
      p.y+=p.vy; p.alpha-=0.002;
      if(p.alpha<0){p.x=Math.random()*W;p.y=-10;p.alpha=0.3+Math.random()*0.5;p.r=2+Math.random()*4;}
    }
    for(const m of mist){
      m.x+=m.vx; if(m.x>W+60)m.x=-60;
    }
    for(const w of water){
      w.x+=w.vx; if(w.x>W+100)w.x=-100;
    }
    for(const s of sparkles){
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.05; s.life-=s.decay;
    }
    sparkles=sparkles.filter(s=>s.life>0);

  }else if(state==='menu'){
    for(const m of mist){m.x+=m.vx;if(m.x>W+60)m.x=-60;}
    for(const p of petals){p.x+=p.vx+Math.sin(frame*0.003+p.swing)*0.3;p.y+=p.vy;p.alpha-=0.002;if(p.alpha<0){p.x=Math.random()*W;p.y=-10;p.alpha=0.3+Math.random()*0.5;}}
  }
}

function draw(){
  X.clearRect(0,0,W,H);

  if(state==='menu'){
    drawMenu();
    return;
  }

  drawBg();

  // Sort platforms by y for depth
  const sorted=[...plats].sort((a,b)=>a.y-b.y);
  for(const p of sorted)drawPlatform(p);

  // Sparkles
  for(const s of sparkles){
    X.globalAlpha=s.life;
    X.fillStyle=s.color;
    X.beginPath(); X.arc(s.x,s.y-camY,s.size*s.life,0,Math.PI*2); X.fill();
  }
  X.globalAlpha=1;

  // Player
  drawPlayer();

  // Peach blossom petals overlay
  for(const p of petals){
    X.save();
    X.translate(p.x,p.y-camY);
    X.rotate(p.rot+frame*0.001);
    X.globalAlpha=p.alpha*0.6;
    X.fillStyle='rgba(255,180,180,0.6)';
    X.beginPath();
    if(p.type==='petal'){
      X.ellipse(0,0,p.r,p.r*0.6,0,0,Math.PI*2);
    }else{
      for(let i=0;i<5;i++){const a=i*1.256;X.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r*0.6);}
      X.closePath();
    }
    X.fill();
    X.restore();
  }
  X.globalAlpha=1;

  drawHUD();

  if(state==='over')drawGameOver();

  // Charge vibration indicator
  if(charging&&onGround&&charge>0.05){
    const rad=20+charge*25;
    X.strokeStyle=`rgba(255,200,100,${charge*0.2})`; X.lineWidth=1.5;
    X.beginPath(); X.arc(px,py-camY,rad,0,Math.PI*2); X.stroke();
  }
}

function handleTouch(x,y){
  if(state==='menu'){
    const bx=W/2-60,by=H*0.55,bw=120,bh=44;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
      sndBtn(); initGame(); return;
    }
    return;
  }
  if(state==='over'){
    const bx=W/2-55,by=H*0.71,bw=110,bh=40;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){
      sndBtn(); initGame(); return;
    }
    // Tap anywhere else also restarts
    initGame(); return;
  }
  if(state==='playing'){
    // Pause check
    if(x>=W-48&&x<=W-12&&y>=6&&y<=38){
      if(state==='playing'){state='paused';}else{state='playing';}
      sndBtn(); return;
    }
    if(!charging){charging=true;charge=0;}
  }
}

// Input events
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0],r=C.getBoundingClientRect();
  const x=(t.clientX-r.left)/scale,y=(t.clientY-r.top)/scale;
  handleTouch(x,y);
});
C.addEventListener('touchend',e=>{
  e.preventDefault();
  if(state==='playing'&&charging){charging=false;sndJump();}
});
C.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
C.addEventListener('mousedown',e=>{
  const r=C.getBoundingClientRect();
  const x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;
  handleTouch(x,y);
});
C.addEventListener('mouseup',e=>{
  if(state==='playing'&&charging){charging=false;sndJump();}
});

// Init particles
spawnPetals(40); spawnMist(20); spawnWater();

// Game loop
function loop(){
  update(); draw(); requestAnimationFrame(loop);
}
loop();
</script>
